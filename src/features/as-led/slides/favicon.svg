  </defs>
  <!-- LED Grid 3x3 -->
  <rect x="2" y="2" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.5"/>
  <rect x="15" y="2" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.7"/>
  <rect x="28" y="2" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.9"/>
  <rect x="2" y="15" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.6"/>
  <rect x="15" y="15" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.8"/>
  <rect x="28" y="15" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="1"/>
  <rect x="2" y="28" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.7"/>
  <rect x="15" y="28" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.9"/>
  <rect x="28" y="28" width="10" height="10" rx="2" fill="url(#ledGradient)" opacity="0.6"/>
